name: Backend database contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate educational content and generated seed
        run: |
          node scripts/generate-seed.mjs
          node scripts/generate-reading-seed.mjs
          git diff --exit-code -- backend/src/main/resources/db/migration/V2__initial_learning_content.sql backend/src/main/resources/db/migration/V4__rc_learning_content.sql
          node scripts/audit-content.mjs
          node scripts/generate-content-corrections.mjs
          git diff --exit-code -- backend/src/main/resources/db/migration/V5__content_quality_amendments.sql
      - name: Build and test study website
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: H2 and disposable MySQL tests, package
        working-directory: backend
        run: bash gradlew --no-daemon test mysqlTest bootJar
