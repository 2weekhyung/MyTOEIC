# Use as a standalone file: docker compose -f compose.existing-db.yml ...
# This file creates NO database container and never touches existing services.
name: mytoeic
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ${MYTOEIC_ENV_FILE:-.env}
    ports: ["127.0.0.1:${HOST_PORT:-18080}:${SERVER_PORT:-8080}"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
