name: mytoeic-local
services:
  mytoeic-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: mytoeic
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mytoeic-data:/var/lib/mysql
    # No host DB port. Existing MySQL/PostgreSQL services are untouched.
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [database]
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ${MYTOEIC_ENV_FILE:-.env}
    depends_on:
      mytoeic-db: {condition: service_healthy}
    ports: ["127.0.0.1:${HOST_PORT:-18080}:${SERVER_PORT:-8080}"]
    restart: unless-stopped
    networks: [database, default]
networks:
  database: {internal: true}
volumes:
  mytoeic-data:
